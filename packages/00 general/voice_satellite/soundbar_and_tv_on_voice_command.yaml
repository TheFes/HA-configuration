automation:
  - id: 2017abca-a756-420b-98fb-228824ce182a
    alias: Voice - Manage Shield and Soundbar on voice command in living room
    mode: parallel
    variables:
      tv_playing: "{{ is_state('media_player.nvidia_shield', 'playing') }}"
      soundbar_was_on: "{{ is_state('media_player.samsung_soundbar', 'on') }}"
      soundbar_source: "{{ state_attr('media_player.samsung_soundbar', 'source') | default('off', true) }}"
      soundbar_volume: "{{ state_attr('media_player.samsung_soundbar', 'volume_level') }}"
      satellite_player: "{{ device_entities(device_id(trigger.entity_id)) | select('match', 'media_player') | list | first }}"
    # Soundbar was in use on another source (TV), so it has to go back there
      restore_soundbar: "{{ soundbar_was_on and soundbar_source not in ['aux', 'off'] }}"
    triggers:
      - trigger: state
        entity_id: assist_satellite.woonkamer
        to: listening
    actions:
      - if: "{{ tv_playing }}"
        then:
          - alias: "Pause the Shield"
            action: media_player.media_pause
            target:
              entity_id: media_player.nvidia_shield
          - alias: Wait until satellite stops listening (processing, or idle when cancelled)
            wait_template: "{{ not is_state(trigger.entity_id, 'listening') }}"
            timeout:
              seconds: 15
          - if: "{{ states(trigger.entity_id) in ['processing', 'responding'] }}"
            then:
              - alias: Set volume soundbar
                action: media_player.volume_set
                target:
                  entity_id: media_player.samsung_soundbar
                data:
                  volume_level: 0.1
      - alias: Store current volume satellite
        variables:
          sat_vol: "{{ state_attr(satellite_player, 'volume_level') }}"
      - alias: Set volume voice satellite
        action: media_player.volume_set
        target:
          entity_id: "{{ satellite_player }}"
        data:
          volume_level: 0.7
      - alias: Switch soundbar to aux, unless the request was already cancelled
        if: "{{ not is_state(trigger.entity_id, 'idle') }}"
        then:
          - alias: Ensure soundbar is on
            action: media_player.turn_on
            target:
              entity_id: media_player.samsung_soundbar
          - alias: Ensure Soundbar is set to aux
            action: media_player.select_source
            data:
              source: aux
            target:
              entity_id: media_player.samsung_soundbar
      - alias: Wait for satellite to be idle (also when it already is)
        repeat:
          sequence:
            - wait_template: "{{ is_state(trigger.entity_id, 'idle') }}"
              timeout:
                minutes: 2
            - delay:
                milliseconds: 500
          until: "{{ is_state(trigger.entity_id, 'idle') or repeat.index >= 5 }}"
      - alias: Set volume voice satellite back to old setting
        action: media_player.volume_set
        target:
          entity_id: "{{ satellite_player }}"
        data:
          volume_level: "{{ sat_vol }}"
      - if: "{{ tv_playing and not is_state('media_player.nvidia_shield', 'playing') }}"
        then:
          - alias: Resume playing on Shield
            action: media_player.media_play
            target:
              entity_id: media_player.nvidia_shield
      - if: "{{ restore_soundbar }}"
        then:
          - if: "{{ not is_state_attr('media_player.samsung_soundbar', 'source', soundbar_source) }}"
            then:
              - alias: Set soundbar back to previous source
                action: media_player.select_source
                data:
                  source: "{{ soundbar_source }}"
                target:
                  entity_id: media_player.samsung_soundbar
          - if: "{{ soundbar_volume is number }}"
            then:
              - alias: Set soundbar back to previous volume
                action: media_player.volume_set
                target:
                  entity_id: media_player.samsung_soundbar
                data:
                  volume_level: "{{ soundbar_volume }}"
        else:
          - variables:
              player: >
                {{
                  integration_entities('music_assistant')
                    | select('match', 'media_player')
                    | select('in', area_entities(area_id(trigger.entity_id)))
                    | list
                    | first
                    | default('unknown')
                }}
          - alias: Wait for music to start playing
            wait_template: "{{ is_state(player, 'playing') }}"
            timeout:
              seconds: 10
          - variables:
              something_played: "{{ wait.completed }}"
          - if: "{{ something_played }}"
            then:
              - alias: Wait for music to stop playing
                wait_for_trigger:
                  - trigger: template
                    value_template: "{{ not is_state(player, 'playing') }}"
                    for:
                      seconds: 10
                timeout:
                  minutes: 5
              - if: "{{ wait.trigger is not none }}"
                then:
                  - alias: Turn soundbar off again
                    action: media_player.turn_off
                    target:
                      entity_id: media_player.samsung_soundbar
            else:
              - if: "{{ not soundbar_was_on }}"
                then:
                  - alias: Nothing played and soundbar was off before, turn it off again
                    action: media_player.turn_off
                    target:
                      entity_id: media_player.samsung_soundbar

  - id: bd5c40c0-6c25-4560-9455-8318d1e3924a
    alias: Make sure Soundbar is set to right source when something is playing
    triggers:
      - trigger: state
        entity_id:
          - media_player.nvidia_shield
        to: playing
        id: optical
      - trigger: state
        entity_id:
          - media_player.woonkamer
        to: playing
        for:
          seconds: 2
        id: aux
    conditions:
      - alias: Soundbar not on right source
        condition: template
        value_template: "{{ not is_state_attr('media_player.samsung_soundbar', 'source', trigger.id) }}"
    actions:
      - if:
          - condition: state
            entity_id: media_player.samsung_soundbar
            state: "off"
        then:
          - alias: Turn on soundbar
            action: media_player.turn_on
            target:
              entity_id: media_player.samsung_soundbar
          - alias: Wait for soundbar to turn on
            wait_template: "{{ is_state('media_player.samsung_soundbar', 'on') }}"
      - alias: Select correct soundbar source
        action: media_player.select_source
        data:
          source: "{{ trigger.id }}"
        target:
          entity_id: media_player.samsung_soundbar
    mode: single
