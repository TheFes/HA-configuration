blueprint:
  domain: automation
  name: Voice - Get ToDo Entries - Local Assist Blueprint
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/todo/1_voice_get_todo_entries_local.yaml
  homeassistant:
    min_version: 2024.10.0
  description: '![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)

    More detailed information can be found [here](https://github.com/TheFes/ha-blueprints/blob/main/documentation/todo/1_voice_get_todo_entries_local.md)

    # Request todo list items fully local

    ### Blueprint setup

    #### Required

    * Set a todo entity to be used as default entity. This entity can be set by name
    in the trigger to avoid the need to add "list" after the name. By default the
    trigger is configured for this to be the shopping list. If you want to use another
    list you need to change the description in the trigger sentence.

    #### Optional

    * Add triggers or change the existing ones

    * Change or translate the settings for the response given by Assist

    #### These translations are already available:

    * [Dutch](https://github.com/TheFes/ha-blueprints/blob/main/documentation/todo/translations/1_voice_get_todo_entries_nl.md)

    * [German](https://github.com/TheFes/ha-blueprints/blob/main/documentation/todo/translations/1_voice_get_todo_entries_de.md)


    ### Usage

    All sentences need to match the format defined in the trigger sentences. By default
    the following sentence is configured:

    - (what''s|what is) on the (shopping list|list named {list_name}|{list_name} list)

    #### Trigger sentence syntax

    All parts between square brackets are optional, the sentence will be recognized
    with and without those parts. A pipe `|` means `or`. All parts between round brackets
    are mandatory, but also here the pipe means `or`.

    The {list_name} part refers to the todo list you want the items for. It is matched
    with the name of the todo entities (not case sensitive), first on the complete
    name, then on a part of the name. Aliases are not supported.

    #### Examples

    ```

    * What''s on the shopping list

    * What is on the list named Blueprints to create

    * What is on the Blueprints to create list

    ```'
  input:
    default_entity:
      name: Default todo list
      selector:
        entity:
          filter:
          - domain:
            - todo
          multiple: false
          reorder: false
    trigger_settings:
      name: Trigger settings
      icon: mdi:chat
      description: Settings for the trigger, you can adjust them, or translate them
        to your own language
      input:
        trigger:
          name: Trigger for Todo list items
          description: The trigger for this automation. The {list_name} part will
            be used for the name of the todo list.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (what's|what is) on the (shopping list|list named {list_name}|{list_name}
            list)
    response_settings:
      name: Settings for the responses
      icon: mdi:chat
      description: Change or translate the response
      collapsed: true
      input:
        no_items_response:
          name: No items on selected list
          description: Response by Assist in case there are no items. `{list_name}`
            is replaced with the name of the list.
          selector:
            text:
              multiline: false
              multiple: false
          default: '{list_name} is empty'
        invalid_list_response:
          name: Invalid list name
          description: Response in case the named list could not be found. `{list_name}`
            is replaced with the requested name.
          selector:
            text:
              multiline: false
              multiple: false
          default: No list with the name {list_name} found.
        list_items_response:
          name: Response in case there are items on the named list.
          description: The response when there are items on the list. `{item_count}`,
            `{list_items}` (one item per line) and `{list_name}` are replaced.
          selector:
            text:
              multiline: false
              multiple: false
          default: 'The list contains {item_count} items: {list_items}.'
triggers:
- trigger: conversation
  command: !input trigger
variables:
  version: 20261116
  default_entity: !input default_entity
  request_name: '{{ (trigger.slots.get(''list_name'') or '''') | lower | trim }}'
  list_entity_request: "{% set lists = states.todo | rejectattr('state', 'eq', 'unavailable')
    | list %} {% set ns = namespace(exact=none, part=none) %} {% if request_name %}\n
    \ {% for s in lists %}\n    {% set n = s.name | lower %}\n    {% if ns.exact is
    none and n == request_name %}\n      {% set ns.exact = s.entity_id %}\n    {%
    elif ns.part is none and (request_name in n or n in request_name) %}\n      {%
    set ns.part = s.entity_id %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{
    ns.exact or ns.part or none }}\n"
  valid_request: '{{ list_entity_request is not none or not request_name }}'
  list_entity: '{{ list_entity_request or default_entity }}'
  list_name: '{{ state_attr(list_entity, ''friendly_name'') or list_entity }}'
actions:
- if: '{{ valid_request }}'
  then:
  - alias: Get items from list
    action: todo.get_items
    continue_on_error: true
    target:
      entity_id: '{{ list_entity }}'
    data:
      status: needs_action
    response_variable: response
- variables:
    list_items: "{{ response[list_entity]['items'] | map(attribute='summary') | map('trim')
      | list\n   if valid_request and response is defined and list_entity in response
      else [] }}\n"
    no_items_response: !input no_items_response
    list_items_response: !input list_items_response
    invalid_list_response: !input invalid_list_response
- alias: Set response
  set_conversation_response: "{% if not valid_request %}\n  {{ invalid_list_response.format(list_name=trigger.slots.list_name)
    }}\n{% elif list_items | count > 0 %}\n  {% set item_count = list_items | count
    %}\n  {% set items = '\\n - ' ~ list_items | join('\\n - ') %}\n  {{ list_items_response.format(item_count=item_count,
    list_items=items, list_name=list_name) }}\n{% else %}\n  {{ no_items_response.format(list_name=list_name)
    }}\n{% endif %}\n"
mode: parallel
max: 10
