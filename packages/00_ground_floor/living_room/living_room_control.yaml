# From: actions_lidl_button_tv_corner.yaml
automation:
  - id: 089a1b6a-4dfa-490e-bda3-675de31e1807
    alias: "LIDL button livingroom"
    triggers:
      - alias: "LIDL button pressed"
        trigger: state
        entity_id: event.knop_tv_hoek_action
        not_from: unavailable
        variables:
          event: "{{ trigger.to_state.attributes.event_type | default('unknown', true) if trigger.to_state else 'unknown' }}"
    actions:
      - alias: "Which click type"
        choose:
          - conditions:
              - alias: "Short"
                condition: template
                value_template: "{{ event == 'on' }}"
            sequence:
              - alias: toggle led light
                action: light.toggle
                target:
                  entity_id: light.tv_lamp
          - conditions:
              - alias: "Double press detected"
                condition: template
                value_template: "{{ event == 'off' }}"
            sequence:
              - alias: "No action for double press"
                stop: "Double press - no action configured"

  # From: livingroom_lights_home_or_dark.yaml
  - id: 56046ae8-2eaa-47c0-b6ad-953cd4b5c641
    alias: "Lights on sunset and arrival home"
    mode: single
    max_exceeded: silent
    triggers:
      - alias: "It gets dark inside"
        trigger: state
        entity_id: binary_sensor.light_inside
        from: "on"
        to: "off"
        id: dark
      - alias: "House mode changed from away to home"
        trigger: state
        entity_id: sensor.house_mode
        from: "Afwezig"
        to: "Thuis"
        id: "home"
      - alias: "NVIDIA Shield turned on"
        trigger: state
        entity_id: media_player.nvidia_shield
        from: "off"
        not_to:
          - unavailable
          - unknown
        id: "dark"
      - alias: "Person arrived home"
        trigger: state
        entity_id:
          - person.martijn
          - person.marleen
        from: "not_home"
        to: "home"
        id: "home_while_sleeping"
    actions:
      - alias: "Arriving home"
        choose:
          - conditions:
              - condition: trigger
                id: home_while_sleeping
              - alias: "Check if house is in sleep mode"
                condition: state
                entity_id: sensor.house_mode
                state: Slapen
            sequence:
              - alias: "Turn on dining table light dimmed"
                action: light.turn_on
                target:
                  entity_id: light.eettafel_plafondlamp
                data:
                  brightness: 100
          - conditions:
              - condition: trigger
                id: home
            sequence:
              - alias: "Turn on extractor hood plug when arriving home"
                action: switch.turn_on
                target:
                  entity_id: switch.afzuigkap
              - alias: "Check if it's not bedtime yet"
                condition: time
                after: "06:00"
                before: "22:00:00"

      - choose:
          - conditions:
              - condition: trigger
                id:
                  - dark
                  - home
              - alias: "Dark inside?"
                condition: state
                entity_id: binary_sensor.light_inside
                state: "off"
              - alias: "Check if it's after sunset (with offset)"
                condition: sun
                after: sunset
                after_offset: "-03:00:00"
              - alias: "Check if house mode allows lighting"
                condition: state
                entity_id: sensor.house_mode
                state:
                  - Thuis
                  - Gast
                  - Vakantie
                  - Relax
            sequence:
              - alias: "Turn on lights"
                action: light.turn_on
                entity_id:
                  - light.tv_lamp
                  - light.keukenspotjes
              - alias: "Turn on play area light"
                action: light.turn_on
                entity_id:
                  - light.speelhoek_template
                data:
                  brightness: 80
              - alias: "Turn on bookcase led"
                action: light.turn_on
                entity_id: light.boekenkast
                data:
                  brightness_pct: 15
                  color_temp_kelvin: 2000
              - alias: "TV on, bedtime children or holiday mode"
                choose:
                  - conditions:
                      - alias: "After bedtime?"
                        condition: time
                        after: "19:15:00"
                      - alias: "Check if TV is not on"
                        not:
                          - alias: "TV aan?"
                            condition: state
                            entity_id: media_player.nvidia_shield
                            state: "off"
                    sequence:
                      - delay: 0.5
                      - alias: "Dim eethoek light"
                        action: light.turn_on
                        target:
                          entity_id:
                            - light.eettafel_template
                        data:
                          brightness_pct: "{{ states('number.eettafel_plafondlamp_start_brightness') }}"
                      - alias: "Dim eethoek light"
                        action: light.turn_on
                        target:
                          entity_id:
                            - light.speelhoek_template
                        data:
                          brightness_pct: "{{ states('number.speelhoek_start_brightness') }}"

  # From: tv_on_music_home_off.yaml
  - id: cfeadbfe-57cd-4034-b993-e09a4eb3ce7d
    alias: "Assist Satellites off when TV turns on"
    mode: single
    max_exceeded: silent
    triggers:
      - alias: "NVIDIA Shield turned on"
        trigger: state
        entity_id: media_player.nvidia_shield
        from: "off"
    actions:
      - variables:
          playing: >
            {{
              [
                'media_player.woonkamer',
                'media_player.keuken'
              ]
                | select('is_state', 'playing')
                | list
            }}
      - if: "{{ playing | count > 0 }}"
        then:
          - alias: "Turn off Voice Satellites that are playing"
            action: media_player.turn_off
            target:
              entity_id: "{{ playing }}"

  - id: "1752261526546"
    alias: Set Shield to Launcher on start
    triggers:
      - alias: "Shield turned on from off to idle"
        trigger: state
        entity_id:
          - media_player.nvidia_shield
        to: idle
        from: "off"
    actions:
      - alias: "Send HOME command to Shield"
        action: androidtv.adb_command
        data:
          command: HOME
        target:
          entity_id: media_player.nvidia_shield
    mode: single

# From: samsung_soundbar.yaml
media_player:
  - platform: samsung_soundbar
    name: "Samsung Soundbar"
    unique_id: bf710249-7580-43e9-9fe9-7254119145b6
    host: 192.168.2.116
    port: 55001
    max_volume: 20
    power_options: true

template:
# Trigger-based: every template renders in one pass from the same snapshot of the
# source players, so source and source_list can no longer get out of sync.
  - triggers:
      - alias: "Any source player changes (state or attributes)"
        trigger: state
        entity_id:
          - media_player.nvidia_shield
          - media_player.shield
          - media_player.samsung_soundbar
          - media_player.woonkamer
      - alias: "Render after startup"
        trigger: homeassistant
        event: start
      - alias: "Render after template reload"
        trigger: event
        event_type: event_template_reloaded
    variables:
    # Shield (ADB) counts as on when not off/unavailable/unknown.
    # Fallback: ADB unavailable/unknown and Android TV Remote (media_player.shield) on.
      n: "{{ states('media_player.nvidia_shield') }}"
      adb_on: "{{ n not in ['off', 'unavailable', 'unknown'] }}"
      fb: "{{ n in ['unavailable', 'unknown'] and is_state('media_player.shield', 'on') }}"
      app: "{{ state_attr('media_player.shield', 'app_name') }}"
      aux: "{{ is_state_attr('media_player.samsung_soundbar', 'source', 'aux') }}"
    # Entity that provides media info: Shield (ADB) > Shield (Remote) > Voice PE (soundbar on Aux) > soundbar
      info: >
        {{ 'media_player.nvidia_shield' if adb_on
           else 'media_player.shield' if fb
           else 'media_player.woonkamer' if aux
           else 'media_player.samsung_soundbar' }}
    # Sources: Shield (ADB source, or Remote app_name in fallback) or soundbar. Never the Voice PE.
      sl: >
        {{ ((state_attr('media_player.nvidia_shield', 'source_list') or [])
            + ([app] if fb and app else [])
            + (state_attr('media_player.samsung_soundbar', 'source_list') or []))
           | unique | list }}
      s: >
        {{ state_attr('media_player.nvidia_shield', 'source') if adb_on
           else app if fb
           else state_attr('media_player.samsung_soundbar', 'source') }}
    media_player:
      - name: "Shield en Soundbar"
        unique_id: 8d2f6c1e-4b7a-4f0e-9a35-2c6e1b7d90a4
        default_entity_id: media_player.shield_en_soundbar
        device_class: tv
      # Shield > Voice PE (soundbar on Aux and playing something) > soundbar.
      # An unknown/unavailable soundbar shows as off.
        state: >
          {% if adb_on %}
            {{ n }}
          {% elif fb %}
            on
          {% elif is_state('media_player.samsung_soundbar', 'on') and aux
                  and states('media_player.woonkamer') in ['idle', 'playing', 'paused', 'buffering'] %}
            {{ states('media_player.woonkamer') }}
          {% elif states('media_player.samsung_soundbar') in ['unavailable', 'unknown'] %}
            off
          {% else %}
            {{ states('media_player.samsung_soundbar') }}
          {% endif %}
        source_list: "{{ sl }}"
        source: "{{ s if s in sl else none }}"

      # --- Volume: always the soundbar (0.2 cap) ---
      # The soundbar integration reports raw volume / max_volume (20). When the volume is raised
      # outside HA (Shield remote via CEC, soundbar remote) that exceeds 1, so clamp it to 0..1.
        volume_level: >-
          {% set v = state_attr('media_player.samsung_soundbar', 'volume_level') %}
          {{ none if v is none else [[v | float(0), 1] | min, 0] | max }}
        is_volume_muted: "{{ state_attr('media_player.samsung_soundbar', 'is_volume_muted') }}"

      # --- Media info: follows the playback entity ---
        media_title: "{{ state_attr(info, 'media_title') }}"
        media_artist: "{{ state_attr(info, 'media_artist') }}"
        media_album_name: "{{ state_attr(info, 'media_album_name') }}"
        app_name: "{{ state_attr(info, 'app_name') }}"
      # Artwork, duration and position only exist for the Voice PE (Music Assistant)
        media_image_url: "{{ state_attr('media_player.woonkamer', 'entity_picture') if info == 'media_player.woonkamer' else none }}"
        media_duration: "{{ state_attr('media_player.woonkamer', 'media_duration') if info == 'media_player.woonkamer' else none }}"
        media_position: "{{ state_attr('media_player.woonkamer', 'media_position') if info == 'media_player.woonkamer' else none }}"

      # --- Actions: render at call time from current states ---
        turn_on:
          action: media_player.turn_on
          target:
            entity_id: >-
              {{ 'media_player.shield'
                 if states('media_player.nvidia_shield') in ['unavailable', 'unknown']
                 else 'media_player.nvidia_shield' }}
        turn_off:
          - if: "{{ states('media_player.nvidia_shield') not in ['off', 'unavailable', 'unknown'] }}"
            then:
              - action: media_player.turn_off
                target:
                  entity_id: media_player.nvidia_shield
            else:
              - if: >-
                  {{ states('media_player.nvidia_shield') in ['unavailable', 'unknown']
                     and is_state('media_player.shield', 'on') }}
                then:
                  - action: media_player.turn_off
                    target:
                      entity_id: media_player.shield
                else:
                  - if: "{{ states('media_player.woonkamer') in ['playing', 'paused', 'buffering'] }}"
                    then:
                      - action: media_player.media_stop
                        target:
                          entity_id: media_player.woonkamer
                  - action: media_player.turn_off
                    target:
                      entity_id: media_player.samsung_soundbar
        volume_set:
          - action: media_player.volume_set
            target:
              entity_id: media_player.samsung_soundbar
            data:
              volume_level: "{{ [0.2, volume_level] | min | round(2) }}"
        volume_up:
          - action: media_player.volume_set
            target:
              entity_id: media_player.samsung_soundbar
            data:
              volume_level: >-
                {{ [0.2, state_attr('media_player.samsung_soundbar', 'volume_level') | float(0) + 0.01] | min | round(2) }}
        volume_down:
          - action: media_player.volume_set
            target:
              entity_id: media_player.samsung_soundbar
            data:
              volume_level: >-
                {{ [0, state_attr('media_player.samsung_soundbar', 'volume_level') | float(0) - 0.01] | max | round(2) }}
        volume_mute:
          - action: media_player.volume_mute
            target:
              entity_id: media_player.samsung_soundbar
            data:
              is_volume_muted: "{{ is_volume_muted }}"
      # Playback: Shield (ADB, else Remote fallback) > Voice PE (soundbar on Aux) > soundbar.
      # The Remote entity has no seek; media_seek fails while the fallback is active.
        media_play:
          - action: media_player.media_play
            target:
              entity_id: &playback >-
                {% set n = states('media_player.nvidia_shield') %}
                {% if n not in ['off', 'unavailable', 'unknown'] %}
                  media_player.nvidia_shield
                {% elif n in ['unavailable', 'unknown'] and is_state('media_player.shield', 'on') %}
                  media_player.shield
                {% elif is_state('media_player.samsung_soundbar', 'on')
                        and is_state_attr('media_player.samsung_soundbar', 'source', 'aux') %}
                  media_player.woonkamer
                {% else %}
                  media_player.samsung_soundbar
                {% endif %}
        media_pause:
          - action: media_player.media_pause
            target:
              entity_id: *playback
        media_stop:
          - action: media_player.media_stop
            target:
              entity_id: *playback
        media_next_track:
          - action: media_player.media_next_track
            target:
              entity_id: *playback
        media_previous_track:
          - action: media_player.media_previous_track
            target:
              entity_id: *playback
        media_seek:
          - action: media_player.media_seek
            target:
              entity_id: *playback
            data:
              seek_position: "{{ seek_position }}"
        play_media:
          - action: media_player.play_media
            target:
              entity_id: *playback
            data:
              media_content_type: "{{ media_content_type }}"
              media_content_id: "{{ media_content_id }}"
      # The Remote entity cannot select sources, so in fallback only soundbar inputs work.
        select_source:
          - action: media_player.select_source
            target:
              entity_id: >-
                {{ 'media_player.nvidia_shield'
                   if states('media_player.nvidia_shield') not in ['off', 'unavailable', 'unknown']
                   else 'media_player.samsung_soundbar' }}
            data:
              source: "{{ source }}"
