blueprint:
  domain: automation
  name: Voice - Calendar Entries - Local Assist Blueprint
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/calendar/1_voice_calendar_entries_local.yaml
  homeassistant:
    min_version: 2024.10.0
  description: '![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)

    More detailed information can be found [here](https://github.com/TheFes/ha-blueprints/blob/main/documentation/calendar/1_voice_calendar_entries_local.md)

    # Request calendar entries fully local

    ### Blueprint setup

    #### Required

    * Set one or more calendar entities to be used

    #### Optional

    * Add triggers or change the existing ones

    * Change or translate the settings for the phrases which will be taken from the
    trigger

    * Change or translate the settings for the response given by Assist

    #### These translations are already available:

    * [Dutch](https://github.com/TheFes/ha-blueprints/blob/main/documentation/calendar/translations/1_voice_calendar_entries_nl.md)

    * [German](https://github.com/TheFes/ha-blueprints/blob/main/documentation/calendar/translations/1_voice_calendar_entries_de.md)

    ### Usage

    All sentences need to match the format defined in the trigger sentences. By default
    the following sentences are configured:

    - (what''s|what is) on the (calendar|agenda) [[for] {phrase}]

    - (what''s|what is) on {phrase}[''s|s] (calendar|agenda)

    #### Trigger sentence syntax

    All parts between square brackets are optional, the sentence will be recognized
    with and without those parts. A pipe `|` means `or`. All parts between round brackets
    are mandatory, but also here the pipe means `or`.

    The {phrase} part refers to the moment you want the calendar entries for. This
    can be `today`, `tomorrow`, `day after tomorrow` for a day related to the current
    day. It can also be a weekday, like `Monday` or `Thursday`. In that case the next
    weekday will be used. You can also use `this week`, `this weekend` or `next week`,
    and `night`, `morning`, `afternoon` or `evening`, optionally combined with a day
    (`tomorrow evening`).

    #### Examples without phrase (will return the current day)

    ```

    * What''s on the agenda

    * What is on the calendar

    ```

    #### Examples with a phrase (will return the requested moment)

    ```

    * What''s on tomorrow''s calendar

    * What is on the calendar for Thursday

    * What''s on the calendar for tomorrow evening

    ```'
  input:
    calendar_entity:
      name: Calendar entities
      selector:
        entity:
          filter:
          - domain:
            - calendar
          multiple: true
          reorder: false
    trigger_settings:
      name: Trigger settings
      icon: mdi:chat
      description: Settings for the trigger, you can adjust them, or translate them
        to your own language
      input:
        trigger:
          name: Trigger for calendar entries
          description: The trigger for this automation. The {phrase} part will be
            used for the period (e.g "tomorrow")
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (what's|what is) on the (calendar|agenda) [[for] {phrase}]
          - (what's|what is) on {phrase}['s|s] (calendar|agenda)
    daily_calendar_settings:
      name: Settings for full day entries
      icon: mdi:calendar
      description: Here all the settings for the daily calendar entries are done
      collapsed: true
      input:
        today:
          name: Today
          description: Phrases to request today's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - today
        tomorrow:
          name: Tomorrow
          description: Phrases to request tomorrow's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - tomorrow
        day_after_tomorrow:
          name: Day after tomorrow
          description: Phrases to request the day after tomorrow's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - day after tomorrow
        monday:
          name: Monday
          description: Phrases to request next monday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - monday
        tuesday:
          name: Tuesday
          description: Phrases to request next Tuesday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - tuesday
        wednesday:
          name: Wednesday
          description: Phrases to request next Wednesday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - wednesday
        thursday:
          name: Thursday
          description: Phrases to request next Thursday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - thursday
        friday:
          name: Friday
          description: Phrases to request next Friday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - friday
        saturday:
          name: Saturday
          description: Phrases to request next Saturday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - saturday
        sunday:
          name: Sunday
          description: Phrases to request next Sunday's calendar entries
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - sunday
        this_week:
          name: This week
          description: Phrases to request the calendar entries from today until the
            end of the week (Sunday)
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - this week
        weekend:
          name: Weekend
          description: Phrases to request the calendar entries for the coming weekend
            (Saturday and Sunday). On Sunday only the current day is used.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - weekend
          - this weekend
          - the weekend
        next_week:
          name: Next week
          description: Phrases to request the calendar entries for next week (Monday
            until Sunday)
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - next week
    day_part_calender_settings:
      name: Settings for the calendar entries for part of a day
      icon: mdi:calendar
      description: Here the phrases for the parts of the day are set. A day part can
        be combined with a phrase for a day, for example "tomorrow morning" or "saturday
        evening".
      collapsed: true
      input:
        night:
          name: Night
          description: Phrases to request the calendar entries for the night
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - night
        morning:
          name: Morning
          description: Phrases to request the calendar entries for the morning
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - morning
        afternoon:
          name: Afternoon
          description: Phrases to request the calendar entries for the afternoon
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - afternoon
        evening:
          name: Evening
          description: Phrases to request the calendar entries for the evening
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - evening
    response_settings:
      name: Settings for the responses
      icon: mdi:chat
      description: Change or translate the response
      collapsed: true
      input:
        response_translations:
          name: Phrases used in the response for the weekdays and months
          selector:
            object:
              multiple: false
          default: {}
        date_format:
          name: Date format
          description: Format for the date, check https://strftime.org for options
          selector:
            text:
              multiline: false
              multiple: false
          default: '%A %-d %B'
        time_format:
          name: Time format
          description: Format for the time, check https://strftime.org for options
          selector:
            text:
              multiline: false
              multiple: false
          default: '%H:%M'
        event_singular:
          name: Singular event
          description: Phrase used to refer to 1 event
          selector:
            text:
              multiline: false
              multiple: false
          default: event
        event_plural:
          name: Multiple events
          description: Phrase used to refer to multiple events
          selector:
            text:
              multiline: false
              multiple: false
          default: events
        combine_word:
          name: Combine word
          description: Word used to combine multiple events. For example "Breakfast,
            Lunch and Dinner"
          selector:
            text:
              multiline: false
              multiple: false
          default: and
        no_events:
          name: No events for selected period
          description: Response by Assist in case there are no events
          selector:
            text:
              multiline: false
              multiple: false
          default: There are no events for this period
        response_invalid_phrase:
          name: Period not recognized
          description: Response by Assist when the requested period is not recognized.
            `{{ phrase }}` contains the period as spoken.
          selector:
            text:
              multiline: false
              multiple: false
          default: I don't know which period you mean with {{ phrase }}
        event_count:
          name: Day introduction
          description: The response for each day will start with a message count
          selector:
            text:
              multiline: false
              multiple: false
          default: On {date} you have {event_count} {events}.
        day_event:
          name: Full day
          description: The response for full day events
          selector:
            text:
              multiline: false
              multiple: false
          default: The entire day you have {event_list}.
        part_day_event:
          name: Part of a day
          description: The response for events which are only part of the day
          selector:
            text:
              multiline: false
              multiple: false
          default: From {start} to {end} you have {event_summary}.
triggers:
- trigger: conversation
  command: !input trigger
variables:
  version: 20261116
  weekday: '{{ now().weekday() }}'
  daily_mapping:
  - phrases: !input today
    delta: 0
  - phrases: !input tomorrow
    delta: 1
  - phrases: !input day_after_tomorrow
    delta: 2
  - phrases: !input monday
    delta: '{{ 0 - weekday + (7 if 0 <= weekday else 0) }}'
  - phrases: !input tuesday
    delta: '{{ 1 - weekday + (7 if 1 <= weekday else 0) }}'
  - phrases: !input wednesday
    delta: '{{ 2 - weekday + (7 if 2 <= weekday else 0) }}'
  - phrases: !input thursday
    delta: '{{ 3 - weekday + (7 if 3 <= weekday else 0) }}'
  - phrases: !input friday
    delta: '{{ 4 - weekday + (7 if 4 <= weekday else 0) }}'
  - phrases: !input saturday
    delta: '{{ 5 - weekday + (7 if 5 <= weekday else 0) }}'
  - phrases: !input sunday
    delta: '{{ 6 - weekday + (7 if 6 <= weekday else 0) }}'
  - phrases: !input this_week
    delta: 0
    end_delta: '{{ 6 - weekday }}'
  - phrases: !input weekend
    delta: '{{ 5 - weekday if weekday <= 5 else 0 }}'
    end_delta: '{{ 6 - weekday }}'
  - phrases: !input next_week
    delta: '{{ 7 - weekday }}'
    end_delta: '{{ 13 - weekday }}'
  day_part_mapping:
  - phrases: !input night
    start: 00:00:00
    end: 06:00:00
  - phrases: !input morning
    start: 06:00:00
    end: '12:00:00'
  - phrases: !input afternoon
    start: '12:00:00'
    end: '18:00:00'
  - phrases: !input evening
    start: '18:00:00'
    end: '24:00:00'
  phrase: '{{ (trigger.get(''slots'', {}).get(''phrase'') or '''') | lower | trim
    or none }}'
  tomorrow_phrases: !input tomorrow
  day_after_tomorrow_phrases: !input day_after_tomorrow
  day_lookup: "{% set ns = namespace(d={}) %} {% for m in daily_mapping %}\n  {% set
    delta = m.delta | int(0) %}\n  {% for p in m.phrases %}\n    {% set ns.d = dict(ns.d,
    **{p | lower | trim: [delta, m.get('end_delta', delta) | int(delta)]}) %}\n  {%
    endfor %}\n{% endfor %} {{ ns.d }}\n"
  part_match: "{% set ns = namespace(index=none, term='', length=0) %} {% if phrase
    %}\n  {% for m in day_part_mapping %}\n    {% set i = loop.index0 %}\n    {% for
    p in m.phrases | map('lower') | map('trim') %}\n      {% if p == phrase %}\n        {%
    set ns.index = i %}{% set ns.term = p %}{% set ns.length = 1000 %}\n      {% elif
    (' ' ~ p ~ ' ') in (' ' ~ phrase ~ ' ') and p | length > ns.length %}\n        {%
    set ns.index = i %}{% set ns.term = p %}{% set ns.length = p | length %}\n      {%
    endif %}\n    {% endfor %}\n  {% endfor %}\n{% endif %} {% set rest = (' ' ~ phrase
    ~ ' ') | replace(' ' ~ ns.term ~ ' ', ' ') | trim if ns.index is not none else
    '' %} {{ {'index': ns.index, 'rest': rest} }}\n"
  daily: '{{ phrase is none or phrase in day_lookup }}'
  part_day: '{{ not daily and part_match.index is not none }}'
  calendar_entity: !input calendar_entity
  translations: !input response_translations
actions:
- alias: Stop when the requested period is not recognized
  if:
  - condition: template
    value_template: '{{ not daily and not part_day }}'
  then:
  - set_conversation_response: !input response_invalid_phrase
  - stop: Period not recognized
- alias: Define the requested period
  variables:
    days: "{% if daily %}\n  {{ day_lookup.get(phrase, [0, 0]) if phrase else [0,
      0] }}\n{% elif part_match.rest in day_lookup %}\n  {{ day_lookup[part_match.rest]
      }}\n{% else %}\n  {% set day_after = day_after_tomorrow_phrases | map('lower')
      | select('in', phrase) | list | count > 0 %}\n  {% set next_day = tomorrow_phrases
      | map('lower') | select('in', phrase) | list | count > 0 %}\n  {% set d = 2
      if day_after else 1 if next_day else 0 %}\n  {{ [d, d] }}\n{% endif %}\n"
    start_time: '{{ day_part_mapping[part_match.index].start if part_day else ''00:00:00''
      }}'
    end_time: '{{ day_part_mapping[part_match.index].end if part_day else ''24:00:00''
      }}'
    start: '{{ (today_at() + timedelta(days=days[0] | int) + as_timedelta(start_time)).isoformat()
      }}'
    end: '{{ (today_at() + timedelta(days=days[1] | int) + as_timedelta(end_time)).isoformat()
      }}'
- alias: Get the calendar events
  action: calendar.get_events
  data:
    start_date_time: '{{ start }}'
    end_date_time: '{{ end }}'
  target:
    entity_id: !input calendar_entity
  response_variable: calendar
  continue_on_error: true
- variables:
    events: "{%- set ns = namespace(events=[]) %} {%- for e in (merge_response(calendar)
      if calendar is defined else []) | sort(attribute='start') %}\n  {%- set ns.events
      = ns.events + [dict(e, summary=(e.summary | default('') | string | regex_replace('\\\\s+',
      ' ') | trim))] %}\n{%- endfor %} {{ ns.events }}\n"
- if:
  - condition: template
    value_template: '{{ iif(events) }}'
  then:
  - alias: Create variables for response
    variables:
      date_format: !input date_format
      time_format: !input time_format
      event_count: !input event_count
      day_event: !input day_event
      part_day_event: !input part_day_event
      event_singular: !input event_singular
      event_plural: !input event_plural
      combine_word: !input combine_word
      first_day: '{{ as_datetime(start).date() | string }}'
      listed_events: "{%- set ns = namespace(events=[]) %} {%- for e in events %}\n
        \ {%- set ns.events = ns.events + [dict(e, day=[e.start[:10], first_day] |
        max)] %}\n{%- endfor %} {{ ns.events }}\n"
      dates: '{{ listed_events | map(attribute=''day'') | unique | list }}'
  - variables:
      response_events: "{%- set ns = namespace(lines=[]) %} {%- for d in dates %}\n
        \ {%- set day_events = listed_events | selectattr('day', 'eq', d) | list %}\n
        \ {#- all-day events have a date-only start ('YYYY-MM-DD' <= d), events\n
        \     which started before this day also cover it entirely #}\n  {%- set full_day
        = day_events | selectattr('start', 'le', d) | list %}\n  {%- set formatted
        = namespace(date=as_datetime(d).strftime(date_format)) %}\n  {%- if translations
        %}\n    {%- for k, v in translations.items() %}\n      {%- set formatted.date
        = formatted.date | replace(k, v) %}\n    {%- endfor %}\n  {%- endif %}\n  {%-
        if not loop.first %}\n    {%- set ns.lines = ns.lines + [''] %}\n  {%- endif
        %}\n  {%- set ns.lines = ns.lines + [event_count.format(date=formatted.date,
        event_count=day_events|count, events=event_singular if day_events|count==1
        else event_plural)] %}\n  {%- set names = full_day | map(attribute='summary')
        | list %}\n  {%- set event_list = names[:-1] | join(', ') ~ ' ' ~ combine_word
        ~ ' ' ~ names[-1] if names | count > 1 else names | first | default('') %}\n
        \ {%- if full_day %}\n    {%- set ns.lines = ns.lines + [day_event.format(event_list=event_list)]
        %}\n  {%- endif %}\n  {%- for e in day_events | reject('in', full_day) %}\n
        \   {%- set ns.lines = ns.lines + [part_day_event.format(start=as_datetime(e.start).strftime(time_format),
        end=as_datetime(e.end).strftime(time_format), event_summary=e.summary)] %}\n
        \ {%- endfor %}\n{%- endfor %} {{ ns.lines | join('\\n') }}\n"
  - alias: Send back the response
    set_conversation_response: '{{ response_events }}'
  else:
  - alias: Send back the response
    set_conversation_response: !input no_events
mode: parallel
max: 10
