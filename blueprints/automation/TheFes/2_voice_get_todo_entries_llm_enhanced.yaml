blueprint:
  domain: automation
  name: Voice - Get ToDo Entries - LLM Enhanced Blueprint
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/todo/2_voice_get_todo_entries_llm_enhanced.yaml
  homeassistant:
    min_version: 2026.11.0
  description: '![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)


    More detailed information can be found [here](https://github.com/TheFes/ha-blueprints/blob/main/documentation/todo/2_voice_get_todo_entries_llm_enhanced.md)


    # Request todo list items with local Assist, enhanced by an AI Task


    The request is caught by local trigger sentences, so you don''t need an LLM as
    conversation agent,

    and the LLM doesn''t need access to your house. An AI Task (`ai_task.generate_data`)
    is used twice:


    1. To determine which list(s) you mean (with structured output, so it can only
    return lists which exist)

    2. To answer your question in natural language, based on the items on those lists


    ### Blueprint setup


    #### Required

    * An AI Task entity (or set a preferred AI Task entity in Home Assistant)


    #### Optional

    * Select the todo lists which can be used (all lists by default) and a default
    list

    * Add triggers or change the existing ones (for example to translate them)

    * Change the instructions for the AI

    * Translate the error response


    ### Usage


    The sentence needs to match one of the trigger sentences, but within those sentences
    you can

    ask anything. By default the following sentences are configured:


    - (what''s|what is) on [the|my] {query} list

    - what (do I|do we) (need|have) to (buy|get|do) [{query}]

    - (is|are) {query} on [the|my] [shopping|todo|to do] list

    - (do I|do we) (need|have) to (buy|get|do) {query}


    #### Examples

    * What''s on the shopping list

    * What do we need to buy

    * Is milk on the shopping list

    * Do I have to do anything for Home Assistant

    '
  input:
    todo_settings:
      name: Todo settings
      icon: mdi:format-list-checks
      input:
        todo_entities:
          name: Todo lists
          description: The todo lists which can be used. Leave empty to use all todo
            lists.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - todo
              reorder: false
        default_list:
          name: Default list
          description: The list which is used when the question doesn't mention a
            list (for example the shopping list). Leave empty to use all lists.
          default:
          selector:
            entity:
              filter:
              - domain:
                - todo
              multiple: false
              reorder: false
    ai_settings:
      name: AI settings
      icon: mdi:robot
      collapsed: true
      input:
        ai_task_entity:
          name: AI Task entity
          description: The AI Task entity used to determine the requested lists and
            create the response. Leave empty to use the preferred AI Task entity set
            in Home Assistant.
          default:
          selector:
            entity:
              filter:
              - domain:
                - ai_task
              multiple: false
              reorder: false
        llm_instructions:
          name: Instructions to determine the lists
          description: Instructions for the AI to determine the requested lists and
            status. The output format is enforced by the structure, so this only needs
            to explain how to interpret the request. You can use `{{ trigger.sentence
            }}` and `{{ default_list_name }}`.
          default: 'You interpret a question about todo lists, like a shopping list
            or a list with tasks. The user asked: "{{ trigger.sentence }}"


            The current date and time is {{ now().strftime(''%A %Y-%m-%d %H:%M'')
            }}.


            Fill in the fields as follows:

            - lists: the list or lists the question is about. Match what the user
            says with the names in the field description (also when the user uses
            another word, like "groceries" for a shopping list) and return the matching
            ids. When no list is mentioned (for example "do we need milk" or "what
            do I need to buy"), use the default list: {{ default_list_name or ''all
            lists'' }}.

            - status: needs_action for items which still need to be done (also when
            the user asks what is on a list), completed only when the user asks for
            items which are done, all when the user asks for both.'
          selector:
            text:
              multiline: true
              multiple: false
        response_instructions:
          name: Instructions for the response
          description: Instructions for the AI to create the response. The question
            and the items are added automatically. You can use `{{ trigger.sentence
            }}`.
          default: You are a voice assistant answering a question about todo lists.
            Answer in the same language as the question, also when the items are in
            another language. Keep it short and natural. The answer will be read aloud
            by a text-to-speech engine, so don't use markdown, lists or emoji. When
            the user asks what is on a list, name the items. When the user asks whether
            something is on a list, answer that first (also match similar words, like
            "milk" and "oat milk"). Mention due dates and overdue items only when
            they are relevant for the question. Only use the items below, don't make
            anything up.
          selector:
            text:
              multiline: true
              multiple: false
    trigger_settings:
      name: Trigger and responses
      icon: mdi:chat
      collapsed: true
      description: The trigger sentences and the response used when something went
        wrong. Translate these to use the blueprint in another language. The response
        of the AI is always in the language of the question.
      input:
        trigger:
          name: Conversation trigger sentences
          description: The sentences which will trigger the automation. {query} is
            a wildcard, the full sentence is always sent to the AI.
          default:
          - (what's|what is) on [the|my] {query} list
          - what (do I|do we) (need|have) to (buy|get|do) [{query}]
          - (is|are) {query} on [the|my] [shopping|todo|to do] list
          - (do I|do we) (need|have) to (buy|get|do) {query}
          selector:
            text:
              multiple: true
              multiline: false
        error_response:
          name: Error response
          description: Used when the AI Task fails, or the items could not be retrieved.
          default: Sorry, something went wrong while getting your todo lists
          selector:
            text:
              multiline: true
              multiple: false
mode: parallel
max: 10
triggers:
- alias: Voice request about a todo list
  trigger: conversation
  command: !input trigger
actions:
- alias: Set the input variables
  variables:
    version: 20261116
    ai_task_entity: !input ai_task_entity
    todo_entities: !input todo_entities
    default_list: !input default_list
- alias: Collect the todo lists
  variables:
    lists: "{% set ids = todo_entities if todo_entities else states.todo | map(attribute='entity_id')
      | list %} {% set ns = namespace(l=[]) %} {% for e in ids if states(e) not in
      ['unavailable', 'unknown'] %}\n  {% set ns.l = ns.l + [{'value': e, 'label':
      entity_name(e, fallback=true)}] %}\n{% endfor %} {{ ns.l }}\n"
    list_desc: '{% for o in lists %}{{ o.label }} = {{ o.value }}{{ ''; '' if not
      loop.last }}{% endfor %} {%- if default_list in lists | map(attribute=''value'')
      | list %}. Default list: {{ default_list }}{% endif %}'
- alias: Create the structure and instructions for the AI Task
  variables:
    default_list_name: "{{ (lists | selectattr('value', 'eq', default_list) | map(attribute='label')
      | list | first) ~ ' (' ~ default_list ~ ')'\n   if default_list in lists | map(attribute='value')
      | list else '' }}"
    llm_instructions: !input llm_instructions
    structure:
      lists:
        description: 'Lists the question is about. Match on the name, return the id.
          Available (name = id): {{ list_desc }}'
        required: true
        selector:
          select:
            multiple: true
            options: '{{ lists }}'
      status:
        description: Which items are requested
        required: true
        selector:
          select:
            options:
            - needs_action
            - completed
            - all
- alias: Stop when there are no todo lists
  if:
  - condition: template
    value_template: '{{ lists | count == 0 }}'
  then:
  - set_conversation_response: !input error_response
  - stop: No todo lists
- alias: Ask the AI Task to determine the requested lists
  action: ai_task.generate_data
  continue_on_error: true
  data: '{% set d = {''task_name'': ''Todo voice request'', ''instructions'': llm_instructions,
    ''structure'': structure} %} {{ dict(d, entity_id=ai_task_entity) if ai_task_entity
    else d }}'
  response_variable: ai_lists
- alias: Stop with error response when the AI Task failed
  if:
  - condition: template
    value_template: '{{ ai_lists is not defined or ai_lists.data is not defined or
      ai_lists.data is string }}'
  then:
  - set_conversation_response: !input error_response
  - stop: AI Task failed
- alias: Read the result of the AI Task
  variables:
    llm: '{{ ai_lists.data }}'
    list_ids: '{{ lists | map(attribute=''value'') | list }}'
    requested: '{% set r = llm.get(''lists'') or [] %} {% set r = ([r] if r is string
      else r | list) | select(''in'', list_ids) | list %} {{ r or ([default_list]
      if default_list in list_ids else list_ids) }}

      '
    status: '{{ llm.get(''status'') if llm.get(''status'') in [''needs_action'', ''completed'',
      ''all''] else ''needs_action'' }}'
- alias: Get the items
  action: todo.get_items
  continue_on_error: true
  target:
    entity_id: '{{ requested }}'
  data: '{{ {''status'': [''needs_action'', ''completed'']} if status == ''all'' else
    {''status'': status} }}'
  response_variable: todo_response
- alias: Stop when the items could not be retrieved
  if:
  - condition: template
    value_template: '{{ todo_response is not defined }}'
  then:
  - set_conversation_response: !input error_response
  - stop: Unable to retrieve the items
- alias: Combine the items of all lists
  variables:
    todo_data: "{% set ns = namespace(lists=[], count=0) %} {% for entity, data in
      todo_response.items() %}\n  {% set items = namespace(l=[]) %}\n  {% for i in
      data.get('items', []) %}\n    {% set it = {'summary': i.summary | default('')
      | string | regex_replace('\\\\s+', ' ') | trim} %}\n    {% set it = dict(it,
      status=i.status) if status == 'all' else it %}\n    {% if i.due %}\n      {%
      set due = as_datetime(i.due) %}\n      {% set due_local = due | as_local if
      i.due | string | length > 10 else today_at() + timedelta(days=(due.date() -
      now().date()).days) %}\n      {% set it = dict(it, due=i.due, due_day=due.strftime('%A
      %-d %B %Y')) %}\n      {% set it = dict(it, overdue=true) if i.status == 'needs_action'
      and (due_local if i.due | string | length > 10 else due_local + timedelta(days=1))
      <= now() else it %}\n    {% endif %}\n    {% set desc = i.description | default('',
      true) | string | regex_replace('\\\\s+', ' ') | trim %}\n    {% set it = dict(it,
      description=desc[:200] ~ ('...' if desc | length > 200 else '')) if desc else
      it %}\n    {% set items.l = items.l + [it] %}\n  {% endfor %}\n  {% set ns.count
      = ns.count + items.l | count %}\n  {% set ns.lists = ns.lists + [{'list': entity_name(entity,
      fallback=true), 'number_of_items': items.l | count, 'items': items.l[:100]}]
      %}\n{% endfor %} {{ {'status': status, 'current_time': now().isoformat(), 'number_of_items':
      ns.count, 'lists': ns.lists} }}\n"
    response_instructions: !input response_instructions
- alias: Create the instructions for the response
  variables:
    answer_instructions: '{{ response_instructions }}


      The current date and time is {{ now().strftime(''%A %Y-%m-%d %H:%M'') }}.


      The question of the user: "{{ trigger.sentence }}"


      Items on the requested lists:

      {{ todo_data | to_json }}'
- alias: Ask the AI Task to answer the question
  action: ai_task.generate_data
  continue_on_error: true
  data: '{% set d = {''task_name'': ''Todo voice response'', ''instructions'': answer_instructions}
    %} {{ dict(d, entity_id=ai_task_entity) if ai_task_entity else d }}'
  response_variable: ai_answer
- alias: Send back the response
  if:
  - condition: template
    value_template: '{{ ai_answer is defined and ai_answer.data is string and ai_answer.data
      | trim | length > 0 }}'
  then:
  - set_conversation_response: '{{ ai_answer.data | trim }}'
  else:
  - set_conversation_response: !input error_response
