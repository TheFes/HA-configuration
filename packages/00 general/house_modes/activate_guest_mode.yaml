automation:
  - id: 3b350cdb-4a8e-4ce9-b239-fc2e329f931d
    alias: "Activate Guest Mode when Guest Wifi is used"
    triggers:
      - trigger: state
        entity_id: sensor.guest_wifi_active
        to:
        id: "on"
      - trigger: state
        entity_id: sensor.guest_wifi_active
        to: "0"
        for:
          hours: 2
        id: "off"
    conditions:
      - >
        {{
          trigger.id == 'off'
          or
            (
              trigger.to_state.state | is_number
              and trigger.from_state.state | is_number
              and trigger.to_state.state | int > trigger.from_state.state | int
            )
        }}
    actions:
      - alias: Toggle guest mode input boolean
        action: input_boolean.turn_{{ trigger.id }}
        target:
          entity_id: input_boolean.gast
      - if: "{{ trigger.id == 'on' }}"
        then:
          - variables:
              added: >
                {{
                  trigger.to_state.attributes.names
                    | reject('in', trigger.from_state.attributes.names)
                    | list
                }}
          - alias: Notify about new guests
            repeat:
              for_each: " {{ added }}"
              sequence:
                - alias: Trigger guest mode notification
                  action: script.turn_on
                  target:
                    entity_id: script.guest_mode_sensor
                  data:
                    variables:
                      guest: " {{ repeat.item }}"
script:
  guest_mode_sensor:
    alias: "Trigger guest mode sensor"
    mode: parallel
    max: 10
    sequence:
      - if: "{{ guest not in state_attr('sensor.guest_wifi_ignore', 'always_guest') | default([], true)}}"
        then:
          - variables:
              host: >
                {{ state_attr('sensor.fritz_guest_hosts', 'hosts')
                    | default([], true)
                    | selectattr('id', 'eq', guest)
                    | first
                    | default({}, true) }}
          - alias: Send guest mode notification to phone
            action: notify.mobile_app_pixel_10_pro
            data:
              title: "🏡 Gastmodus geactiveerd"
              message: >
                Gastmodus geactiveerd door {{ host.name | default(guest, true) }}
                {%- if host.ip is defined %} ({{ host.ip }}){% endif %}
                {%- if host.mac is defined and host.mac != host.name %}, MAC {{ host.mac }}{% endif %}
              data:
                ttl: 0
                priority: high
                channel: Guest
                notification_icon: mdi:home
                tag: "Guest_{{ guest }}"
                actions:
                  - action: "add_guest_{{ guest }}"
                    title: "Gast"
                  - action: "ignore_guest_{{ guest }}"
                    title: "Negeer"
          - alias: Wait for user response to guest notification
            wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "add_guest_{{ guest }}"
                id: add
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "ignore_guest_{{ guest }}"
                id: ignore
            timeout: "03:00:00"
            continue_on_timeout: false
          - if: "{{ wait.trigger.id == 'add' }}"
            then:
              - alias: Add guest to always guest list
                event: wifi_always_guest
                event_data:
                  name: "{{ guest }}"
            else:
              - alias: Add guest to ignore list
                event: wifi_ignore
                event_data:
                  name: "{{ guest }}"
template:
  - triggers:
      - trigger: event
        event_type: wifi_ignore
        id: ignore
      - trigger: event
        event_type: wifi_always_guest
        id: always_guest
    sensor:
      - unique_id: cd9ca26d-0bfc-4990-9621-0ce5359cdf56
        name: Guest Wifi Ignore
        state: OK
        icon: mdi:wifi-cancel
        attributes:
          ignore: >
            {% set id = 'ignore' %}
            {% set current = this.attributes.get(id, []) %}
            {% if trigger.id == id %}
              {% set new = trigger.event.data.name | default(none, true) %}
              {% set new = [new] if new else [] %}
              {% if trigger.event.data.remove | default(false) %}
                {{ current | reject('in', new) | list }}
              {% else %}
                {{ current + new }}
              {% endif %}
            {% else %}
              {{ current }}
            {% endif %}
          always_guest: >
            {% set id = 'always_guest' %}
            {% set current = this.attributes.get(id, []) %}
            {% if trigger.id == id %}
              {% set new = trigger.event.data.name | default(none, true) %}
              {% set new = [new] if new else [] %}
              {% if trigger.event.data.remove | default(false) %}
                {{ current | reject('in', new) | list }}
              {% else %}
                {{ (current + new) | unique | list }}
              {% endif %}
            {% else %}
              {{ current }}
            {% endif %}
  - sensor:
      - unique_id: 4a803590-3649-473a-a10d-809a09fcfd2f
        name: Guest Wifi Active
        availability: "{{ has_value('sensor.fritz_guest_hosts') }}"
        state: >
          {% set ignore = state_attr('sensor.guest_wifi_ignore', 'ignore') | default([], true) %}
          {% set always = state_attr('sensor.guest_wifi_ignore', 'always_guest') | default([], true) %}
          {{ state_attr('sensor.fritz_guest_hosts', 'hosts') | default([], true)
              | map(attribute='id')
              | reject('in', ignore | reject('in', always) | list)
              | list | count }}
        attributes:
          names: >
            {% set ignore = state_attr('sensor.guest_wifi_ignore', 'ignore') | default([], true) %}
            {% set always = state_attr('sensor.guest_wifi_ignore', 'always_guest') | default([], true) %}
            {{ state_attr('sensor.fritz_guest_hosts', 'hosts') | default([], true)
                | map(attribute='id')
                | reject('in', ignore | reject('in', always) | list)
                | list }}
command_line:
  - sensor:
      name: Fritz Guest Hosts
      unique_id: cf485815-4c5c-45f4-8adb-097b761d8ad4
      command_timeout: 30
      scan_interval: 60
      value_template: "{{ value_json.count }}"
      json_attributes:
        - hosts
        - error
      command: |-
        python3 -c '
        import json
        try:
            import re
            import yaml
            from fritzconnection.lib.fritzhosts import FritzHosts
            GUEST_PREFIX = "192.168.189."
            IP_NAME = re.compile(r"^PC-\d+-\d+-\d+-\d+$")
            with open("/config/secrets.yaml", encoding="utf-8") as fh:
                s = yaml.safe_load(fh)
            hosts = FritzHosts(
                address=s["fritz_tr064_host"],
                user=s["fritz_tr064_user"],
                password=s["fritz_tr064_password"],
                timeout=10,
            ).get_hosts_attributes()
            def guest(h):
                name = h.get("HostName") or ""
                mac = h.get("MACAddress") or ""
                ident = mac if (not name or IP_NAME.match(name)) else name
                return {"id": ident, "name": name or mac, "ip": h.get("IPAddress"), "mac": mac}
            guests = [
                guest(h)
                for h in hosts
                if str(h.get("Active")).lower() in ("1", "true")
                and str(h.get("IPAddress") or "").startswith(GUEST_PREFIX)
            ]
            print(json.dumps({"count": len(guests), "hosts": guests, "error": None}))
        except Exception as err:
            print(json.dumps({"count": None, "hosts": [], "error": f"{type(err).__name__}: {err}"}))
        '
