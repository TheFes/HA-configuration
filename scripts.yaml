fetch_weather_forecast_data:
  alias: Fetch Weather Forecast Data
  description: Gets the weather forecast and current weather conditions. Use this
    tool for every question about the weather, also for questions like "do I need
    an umbrella". Pass the complete question of the user in the query field, in the
    words of the user.
  icon: mdi:weather-lightning-rainy
  use_blueprint:
    input:
      weather_entity: weather.combined
    path: TheFes/3_voice_weather_forecast_full_llm_v2.yaml
fetch_calendar_events:
  alias: Fetch Calendar Events
  description: Gets the events from my calendars. Use this tool for every question
    about appointments, events or what is planned. Pass the complete question of the
    user in the query field, in the words of the user.
  icon: mdi:calendar
  use_blueprint:
    input:
      calendar_entities:
      - calendar.m_m
      - calendar.thefes
    path: TheFes/3_voice_calendar_entries_full_llm_v2.yaml
martijn_starts_working:
  alias: Martijn Starts Working
  sequence:
  - if:
    - condition: numeric_state
      entity_id: sensor.awtrix_martijn_illuminance
      below: 50
    then:
    - alias: Turn on office ceiling light
      action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 100
        kelvin: 6500
      target:
        entity_id: light.werkkamer_martijn_plafond_template
  - alias: Start Studio Brussel radio
    action: music_assistant.play_media
    metadata: {}
    data:
      media_type: radio
      media_id: Studio Brussel
    target:
      entity_id: media_player.martijn
  description: Actions to be performed when Martijn starts working in his office
voice_script_for_music_assistant_requests:
  alias: Voice - Script for Music Assistant requests
  description: Play music with Music Assistant. Use this tool whenever the user asks
    to play, shuffle or listen to music, an artist, an album, a song, a playlist or
    a radio station. Pass the complete request in the query field, in the words of
    the user, and add where to play it (the area the request comes from) when the
    user does not mention a location.
  icon: mdi:account-music
  use_blueprint:
    input:
      actions:
      - alias: Define variables used to send notification to the right display
        variables:
          map_to_awtrix:
          - area_name: Werkkamer Martijn
            topic: awtrix_martijn/notify
          - area_name: Pepijn
            topic: awtrix_pepijn/notify
          - area_name: Floris
            topic: awtrix_floris/notify
          topic: '{{ map_to_awtrix | selectattr(''area_name'', ''in'', area | default([],
            true) | map(''area_name'') | list) | map(attribute=''topic'') | list }}'
      - alias: Show on Ulanzi display in case there is one in the room (published
          by automation, mqtt.publish is admin-only)
        if: '{{ topic | count > 0 }}'
        then:
        - event: awtrix_music_notify
          event_data:
            topics: '{{ topic }}'
            text: '{{ media_description }}'
    path: TheFes/mass_llm_script_v2.yaml
current_device_state:
  sequence:
  - variables:
      mapping:
        dishwasher:
          currently_active: '{{ iif(states(''binary_sensor.dishwasher_active'') |
            bool(false), ''Yes'', ''No'') }}'
          current_program: '{%- set prog = states(''input_select.dishwasher_program'')
            %} {%- set prog_extra = states(''input_select.dishwasher_program_extra'')
            %} {%- set running = states(''binary_sensor.dishwasher_active'') | bool
            %} {{ [prog, prog_extra] | select() | join('' '') if running else ''Inactive''
            }}

            '
          ready_at: '{{ as_datetime(states(''sensor.dishwasher_end_time'')).replace(second=0,
            microsecond=0) if is_state(''binary_sensor.dishwasher_active'', ''on'')
            else ''Inactive'' }}

            '
          minutes_left: '{{ [(as_datetime(states(''sensor.dishwasher_end_time''))
            - now()).total_seconds() // 60, 0] | max }}

            '
        washing_machine:
          currently_active: '{{ iif(is_state(''binary_sensor.wasmachine_actief'',
            ''on''), ''Yes'', ''No'') }}'
          current_program: '{%- set status = states(''sensor.overloop_zolder_wasmachine_current_status'')
            %} {%- set minutes = states(''sensor.overloop_zolder_wasmachine_total_time'')
            | int(0) %} {%- if is_state(''binary_sensor.wasmachine_actief'', ''on'')
            %} {{ status | replace(''_'', '' '') }}{{ '' (program of '' ~ minutes
            ~ '' minutes)'' if minutes > 0 }} {%- elif status == ''reserved'' %} Delayed
            start set {%- else %} Inactive {%- endif %}

            '
          ready_at: '{%- set end = states(''sensor.overloop_zolder_wasmachine_remaining_time'')
            | as_datetime %} {{ (end | as_local).replace(second=0, microsecond=0)
            if is_state(''binary_sensor.wasmachine_actief'', ''on'') and end is not
            none else ''Inactive'' }}

            '
          minutes_left: '{%- set end = states(''sensor.overloop_zolder_wasmachine_remaining_time'')
            | as_datetime %} {{ [((end - now()).total_seconds() // 60) | int, 0] |
            max if is_state(''binary_sensor.wasmachine_actief'', ''on'') and end is
            not none else 0 }}

            '
      response: '{{ mapping[device] }}'
  - stop: ''
    response_variable: response
  fields:
    device:
      selector:
        select:
          options:
          - dishwasher
          - washing_machine
      name: Device
      description: Select from which device the details on the current state are requested.
      required: true
  alias: Current device state
  description: Script to request the current state of a device in the house. The information
    is only available for the devices in the "device" option. Convert the time in
    minutes to hours and minutes in case it is more than 60 minutes.
voice_get_todo_entries_full_llm_script:
  alias: Voice - Get ToDo entries - Full LLM script
  description: Gets the items on my todo lists, including the shopping list. Use this
    tool for every question about what is on a list. Pass the complete question of
    the user in the query field, in the words of the user.
  use_blueprint:
    input:
      default_list: todo.boodschappenlijst
    path: TheFes/3_voice_get_todo_entries_full_llm_v2.yaml
llm_web_search:
  sequence:
  - action: conversation.process
    metadata: {}
    data:
      text: '{{ query }}'
      agent_id: conversation.gemini_web_search
    response_variable: response
  - stop: ''
    response_variable: response
  fields:
    query:
      selector:
        text:
          multiline: true
      name: Query
      description: The search query which needs to be used to find the information
        on the web
      required: true
  alias: LLM Web search
  description: Makes a Google search to answer questions that are completely unrelated
    with the smart home and are exclusively about current events or information in
    real-time like the current president, results of last night's game, release dates,
    etc.
bedtime_floris_routine:
  alias: Floris is going to sleep (Voice)
  icon: mdi:bed
  mode: restart
  sequence:
  - alias: Send Floris sleeping event
    event: floris_sleeping
  - action: number.set_value
    alias: Set Floris dimmer to sleep brightness
    data:
      value: 30
    target:
      entity_id: number.floris_start_brightness
  - action: number.set_value
    alias: Set Floris dimmer to sleep brightness
    data:
      value: 40
    target:
      entity_id: number.floris_leeslamp_start_brightness
  - delay: 0.5
  - action: light.turn_on
    alias: Light on
    target:
      entity_id:
      - light.floris_template
      - light.bedlamp_floris
      - light.floris_leeslamp_template
  - alias: Turn on graafmachine, dimmed and warm
    action: light.turn_on
    target:
      entity_id: light.graafmachine_template
    data:
      brightness_pct: 20
      color_temp_kelvin: 2200
test_vars:
  sequence:
  - variables:
      delta: '{{ timedelta(minutes=2, seconds=15) }}'
      string: '{{ timedelta_string(delta, 2) }}'
      string2: '{{ timedelta_string(as_timedelta(delta), 2) }}'
      string3: '{% set delta = timedelta(minutes=2, seconds=15) %} {{ timedelta_string(delta,
        2) }}

        '
  alias: Test vars
  description: ''
voice_set_reminders_full_llm_script_version_2:
  alias: Voice - Set Reminders - Full LLM script (version 2)
  description: Sets a reminder for one or more people at a date and time. Use this
    tool whenever the user asks to be reminded of something, or to remind someone
    else. Pass the complete request of the user in the query field, in the words of
    the user. When the tool reports missing information, ask the user for it and call
    the tool again with the complete request including the answer.
  use_blueprint:
    path: TheFes/3_voice_reminder_full_llm_v2.yaml
    input:
      todo_entity: todo.reminder
      recipients:
      - name: Martijn
        aliases: Papa, dad, Fes
        person: person.martijn
        notify:
        - notify.thefes_casa_alert_martijn
        - notify.pixel_10_pro
        satellites:
        - assist_satellite.keuken
      - name: Marleen
        aliases: Mama, mam, mom
        person: person.marleen
        notify:
        - notify.iphone_van_marleen
        satellites:
        - assist_satellite.keuken
voice_add_calendar_event_full_llm_script:
  alias: Voice - Add Calendar Event - Full LLM script
  description: Adds an event or appointment to a calendar. Use this tool whenever
    the user wants to add, plan or schedule something in a calendar or agenda. Pass
    the complete request of the user in the query field, in the words of the user.
    When the tool reports missing information, ask the user for it and call the tool
    again with the complete request including the answer.
  use_blueprint:
    input:
      default_calendar: calendar.m_m
    path: TheFes/3_voice_add_calendar_event_full_llm.yaml
