- id: '1794775349498'
  alias: Show Music Assistant voice request on Awtrix display
  description: Publishes the song requested by voice to the Awtrix display(s) in the
    room. Runs as an automation because mqtt.publish is admin-only and voice requests
    can come from non-admin users. Fired by script.voice_script_for_music_assistant_requests.
  triggers:
  - event_type: awtrix_music_notify
    trigger: event
  actions:
  - alias: Send notification to each display
    repeat:
      for_each: '{{ trigger.event.data.topics | default([], true) }}'
      sequence:
      - action: mqtt.publish
        data:
          payload: '{{ dict(text=trigger.event.data.text, icon=''musicvisualisation'')
            | to_json }}'
          qos: 0
          retain: false
          topic: '{{ repeat.item }}'
  max_exceeded: silent
  mode: queued
