automation:
  - id: fa1ca856-95ab-4317-bb6e-7681d74f136f
    alias: Voice - Remaining time dishwasher
    mode: parallel
    triggers:
      - alias: Trigger sentence
        trigger: conversation
        command:
          - hoe lang moet [de] vaat[wasser] [nog]
          - (wanneer|hoe laat) is de vaat[wasser] klaar
    actions:
      - alias: Set response
        set_conversation_response: >
          {%- set time_set = states('sensor.dishwasher_end_time') | as_datetime %}
          {%- if now() < time_set and is_state('binary_sensor.dishwasher_active', 'on') %}
            {%- set seconds = (time_set  - now()).seconds %}
            {%- set hours = (seconds / 3600) | int %}
            {%- set minutes = (((seconds / 3600) - hours) * 60) | int %}
            {%- if hours == 0 %}
              De vaatwasser is over {{ minutes ~ (' minuut' if minutes == 1 else ' minuten') }} klaar.
            {%- else %}
              De vaatwasser is klaar rond {{ time_set.strftime('%H:%M') }}.
            {%- endif %}
          {%- elif now() < time_set | as_local %}
            De vaatwasser is nu elk moment klaar
          {%- else %}
            De vaatwasser is niet actief
          {%- endif %}

  - id: f9e73c28-8d45-4148-8a9c-2b4e5323334b
    alias: Voice - Remaining time washing machine
    mode: parallel
    triggers:
      - alias: Trigger sentence
        trigger: conversation
        command:
          - hoe lang moet [de] was[machine] [nog]
          - (wanneer|hoe laat) is de was[machine] klaar
    actions:
      - alias: Set response
        set_conversation_response: >
          {%- set status = states('sensor.overloop_zolder_wasmachine_current_status') %}
          {%- set active = is_state('binary_sensor.wasmachine_actief', 'on') %}
          {%- set end = states('sensor.overloop_zolder_wasmachine_remaining_time') | as_datetime %}
          {%- set start = states('sensor.wasmachine_start_time') | as_datetime %}
          {%- if active and end is not none %}
            {%- set minutes = ((end - now()).total_seconds() / 60) | round(0) | int %}
            {%- if minutes <= 1 %}
              De wasmachine is nu elk moment klaar.
            {%- elif minutes < 60 %}
              De wasmachine is over {{ minutes }} minuten klaar.
            {%- else %}
              De wasmachine is klaar rond {{ (end | as_local).strftime('%H:%M') }}.
            {%- endif %}
          {%- elif active %}
            De wasmachine is bezig, maar de eindtijd is niet bekend.
          {%- elif status in ['unavailable', 'unknown'] %}
            Ik kan de wasmachine nu niet bereiken.
          {%- elif (status == 'reserved' or is_state('input_boolean.wasmachine_remote_start', 'on')) and start is not none and start > now() %}
            De wasmachine is ingepland en gaat rond {{ (start | as_local).strftime('%H:%M') }} aan.
          {%- else %}
            De wasmachine is niet actief.
          {%- endif %}
