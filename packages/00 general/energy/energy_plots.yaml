## SCRIPT TO STORE THE DATA ##
script:
  plot_energy_usage:
    alias: "Plot energy usage"
    icon: mdi:brightness-percent
    mode: parallel
    max: 20
    max_exceeded: silent
    fields:
      sensor:
        description: "Select energy sensor"
        name: Energy Sensor
        example: sensor.dishwasher_energy
        required: true
        selector:
          entity:
            multiple: false
            filter:
              - domain: sensor
                device_class: energy
      description:
        description: "Description for the plot"
        name: Description
        example: "Dishwasher ECO Silent"
        required: true
        selector:
          text:
      no_weight_points:
        description: "Number of weight points/hour"
        name: Weight points
        default: 1
        example: 3
        required: true
        selector:
          number:
            min: 0
            max: 12
            step: 1
            mode: slider
      stop_entity:
        description: "Entity to use to stop the plot"
        example: input_boolean.dishwasher_off
        required: true
        selector:
          entity:
      stop_state:
        description: "State the entity should have to stop the plot"
        example: "off"
        required: true
        selector:
          text:
    sequence:
      - variables:
          not_defined: >
            {{ [
                  'energy sensor' if sensor is not defined or not sensor else none,
                  'stop entity' if stop_entity is not defined or not stop_entity else none,
                  'stop state' if stop_state is not defined else none
                ] | reject('none') | list
            }}
      - if: "{{ not_defined | count > 0 }}"
        then:
          - stop: >
              {{ not_defined | join(', ') }} {{ 'is' if not_defined | count == 1 else 'are'}} not defined, script has stopped
            error: true
      - variables:
          description: "{{ description | default('unknown') }}"
          no_weight_points: "{{ no_weight_points | default(4) | int(4) }}"
      - repeat:
          until:
            - condition: template
              value_template: "{{ is_state(stop_entity, stop_state) }}"
          sequence:
            - variables:
                sensor_state: "{{ states(sensor) | float('na') }}"
            - if: "{{ not sensor_state | is_number }}"
              then:
                - stop: "Received non numeric state, script has stopped"
                  error: true
            - event: update_energy_plot
              event_data:
                description: "{{ description }}"
                status: "{{ 'first' if repeat.first else 'ongoing' }}"
                state: "{{ sensor_state }}"
                no_weight_points: "{{ no_weight_points }}"
            - delay:
                minutes: "{{ 60 / no_weight_points }}"
      - event: update_energy_plot
        event_data:
          description: "{{ description }}"
          no_weight_points: "{{ no_weight_points }}"
          status: complete

## TEMPLATE SENSOR TO STORE THE DATA ##
template:
  - trigger:
      - platform: event
        event_type: update_energy_plot
        id: plot_update
      - platform: homeassistant
        event: start
        id: remove_incomplete
    sensor:
      - unique_id: 36c9491c-2e16-4fc3-bc9f-a6ada5fc88b7
        name: Energy plots
        state: OK
        attributes:
          energy_plots: >
            {%- set current = this.attributes.get('energy_plots', {}) -%}
            {%- if trigger.id == 'plot_update' and trigger.event.data is defined -%}
              {%- set status = trigger.event.data.status | default('unknown') -%}
              {%- set description = trigger.event.data.description | default('unknown') ~ ('(incomplete)' if not status in ['complete', 'remove'] else '') -%}
              {%- if status == 'remove_all' -%}
                {{ dict() }}
              {%- elif status == 'remove' -%}
                {{ dict(current.items() | rejectattr('0', 'eq', description)) }}
              {%- else -%}
                {%- set state = trigger.event.data.state | default(0) -%}
                {%- set weight_points = trigger.event.data.no_weight_points | default(none) %}
                {%- set date_time = now().replace(microsecond=0).isoformat() -%}
                {%- if status == 'first' -%}
                  {%- set data = {description: dict(data=[], state=state, start=state, start_time=now().isoformat(), no_weight_points=weight_points, last_update=date_time)} -%}
                {%- elif status == 'ongoing' -%}
                  {%- set values = current.get(description, {}) -%}
                  {%- set data = values.get('data', []) -%}
                  {%- set update = state - values.get('state', 0) -%}
                  {%- set start = values.get('start', 0) -%}
                  {%- set start_time = values.get('start_time', now().isoformat()) -%}
                  {%- set data = data + [update | round(3)] -%}
                  {%- set data = {
                                    description: {
                                      'data': data,
                                      'state': state,
                                      'start': start,
                                      'start_time': start_time,
                                      'no_weight_points': weight_points,
                                      'last_update': date_time
                                      }
                                  }
                -%}
                {%- elif status == 'complete' -%}
                  {%- set description_incomplete = description~'(incomplete)' -%}
                  {%- set values = current.get(description_incomplete, {}) -%}
                  {%- set data = values.get('data', []) -%}
                  {%- set update = (values.get('state', 0) - values.get('start', 0)) | round(3) -%}
                  {%- set start_time = values.get('start_time', now().isoformat()) -%}
                  {%- set duration = (now() - as_datetime(start_time)).total_seconds() | int %}
                  {%- set no_zero = data | select() | list -%}
                  {%- set factor = 1 / no_zero | min if no_zero else 0 -%}
                  {%- set data = data | map('multiply', factor) | map('round', 3) | list -%}
                  {%- set current = dict(current.items() | rejectattr('0', 'eq', description_incomplete)) -%}
                  {%- set data = {
                                    description: {
                                      'data': data,
                                      'kwh_used': update,
                                      'duration': duration,
                                      'no_weight_points': weight_points,
                                      'last_update': date_time
                                      }
                                  }
                -%}
                {%- endif -%}
                {{ combine(current, data | default({})) }}
              {%- endif -%}
            {%- elif trigger.id == 'remove_incomplete' -%}
              {{ dict(current.items() | rejectattr('0', 'search', '\(incomplete\)$')) }}
            {%- else -%}
              {{ current }}
            {%- endif -%}

## AUTOMATION TO START THE SCRIPT ##
automation:
  - id: 2794cd64-a5d0-48e3-9edb-08527ac231bc
    alias: "Plot Wasmachine Energy"
    description: >
      Records the energy profile of a wash, named after the program duration from LG ThinQ
      (the integration no longer provides the program name). Used by Start Washing machine.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.wasmachine_actief
        from: "off"
        to: "on"
    actions:
      - alias: LG sets the program time just after the status changes to running
        wait_template: "{{ has_value('sensor.overloop_zolder_wasmachine_total_time') }}"
        timeout:
          seconds: 30
        continue_on_timeout: true
      - action: script.turn_on
        target:
          entity_id: script.plot_energy_usage
        data:
          variables:
            description: >
              {%- set t = states('sensor.overloop_zolder_wasmachine_total_time') | int(0) -%}
              wasmachine_{{ t ~ 'min' if t > 0 else 'onbekend' }}
            no_weight_points: 4
            stop_state: "off"
            sensor: sensor.wasmachine_energy
            stop_entity: binary_sensor.wasmachine_actief

  - id: e6a37361-f675-4b92-8882-af73f9f49ac7
    alias: "Plot Dishwasher Energy"
    triggers:
      - trigger: state
        entity_id: binary_sensor.dishwasher_active
        from: "off"
        to: "on"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.plot_energy_usage
        data:
          variables:
            description: >
              {%- set m = states('input_select.dishwasher_program') | slugify -%}
              {%- set t = states('input_select.dishwasher_program_extra') | slugify -%}
              vaatwasser_{{ m }}_{{ t }}
            no_weight_points: 4
            stop_state: "off"
            sensor: sensor.vaatwasser_energy
            stop_entity: binary_sensor.dishwasher_active
