blueprint:
  domain: automation
  name: Voice - Add ToDo Item with due date - LLM Enhanced Blueprint
  author: TheFes
  source_url: https://github.com/TheFes/ha-blueprints/blob/main/todo/2_voice_add_todo_item_llm_enhanced.yaml
  homeassistant:
    min_version: 2026.11.0
  description: '![Image](https://github.com/TheFes/ha-blueprints/blob/main/images/TheFesCasa_logo_bp_light.png?raw=true)


    More detailed information can be found [here](https://github.com/TheFes/ha-blueprints/blob/main/documentation/todo/2_voice_add_todo_item_llm_enhanced.md)


    # Add todo items with a due date and time, using local Assist enhanced by an AI
    Task


    The request is caught by local trigger sentences, so you don''t need an LLM as
    conversation agent,

    and the LLM doesn''t need access to your house. One AI Task call (`ai_task.generate_data`)
    with

    structured output determines the items, the list (it can only return lists which
    exist), the due

    date and time and a confirmation in the language of the request.


    ### Blueprint setup


    #### Required

    * A default todo list

    * An AI Task entity (or set a preferred AI Task entity in Home Assistant)


    #### Optional

    * Change or translate the trigger sentences and the error response


    ### Usage


    By default the following sentence is configured. It also catches requests without
    a due moment,

    so it replaces the built-in intent for adding items in these sentences:


    - (add|put) {item} (on|to) [the|my] {list}


    #### Examples

    * Add call the plumber to the Home Assistant list for tomorrow at 10

    * Put milk and eggs on the shopping list

    * Add renew passport to my todo list, due next Friday

    '
  input:
    todo_settings:
      name: Todo settings
      icon: mdi:format-list-checks
      input:
        todo_entities:
          name: Todo lists
          description: The todo lists items can be added to. Leave empty to allow
            all todo lists.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - todo
              reorder: false
        default_list:
          name: Default list
          description: The list used when the request doesn't mention a list.
          selector:
            entity:
              filter:
              - domain:
                - todo
              multiple: false
              reorder: false
    ai_settings:
      name: AI settings
      icon: mdi:robot
      collapsed: true
      input:
        ai_task_entity:
          name: AI Task entity
          description: The AI Task entity used to interpret the request. Leave empty
            to use the preferred AI Task entity set in Home Assistant.
          default:
          selector:
            entity:
              filter:
              - domain:
                - ai_task
              multiple: false
              reorder: false
        llm_instructions:
          name: Instructions for the AI
          description: Instructions for the AI to interpret the request. The output
            format is enforced by the structure. You can use `{{ trigger.sentence
            }}` and `{{ default_list_name }}`.
          default: 'You interpret a voice request to add one or more items to a todo
            list. The user said: "{{ trigger.sentence }}"


            The current date and time is {{ now().strftime(''%A %Y-%m-%d %H:%M'')
            }}.


            Fill in the fields as follows:

            - items: the items to add, as they should appear on the list, without
            the list name and without the due moment. Use several items when the user
            names several things ("milk and eggs" are two items). Keep the language
            of the request.

            - list: the list to add the items to. Match what the user says with the
            names in the field description and return the id. When no list is mentioned,
            or a general word like "shopping list" or "todo list" which doesn''t match
            a name, use the default list: {{ default_list_name or ''the first list''
            }}.

            - due_date: only when the user mentions when the item is due, in the format
            YYYY-MM-DD. A weekday means the next occurrence of that day (not today).
            When only a time is mentioned, use today, or tomorrow when that time has
            already passed.

            - due_time: only when a time or a part of the day is mentioned, in the
            24 hour format HH:MM:SS. Morning is 09:00:00, afternoon 14:00:00, evening
            19:00:00 and tonight 20:00:00.

            - description: only when the user gives extra details or a note for the
            item.

            - confirmation: one short sentence in the language of the request, confirming
            which items were added to which list, and when they are due. When the
            list can''t store due dates (marked "no due dates") and the user mentioned
            a due moment, say that the item was added without the due date. Write
            times and dates the way people say them.'
          selector:
            text:
              multiline: true
              multiple: false
    trigger_settings:
      name: Trigger and responses
      icon: mdi:chat
      collapsed: true
      description: The trigger sentences and the response used when something went
        wrong. Translate these to use the blueprint in another language. The confirmation
        is created by the AI in the language of the request.
      input:
        trigger:
          name: Conversation trigger sentences
          description: The sentences which will trigger the automation. The wildcards
            are only used to match the sentence, the full sentence is always sent
            to the AI.
          default:
          - (add|put) {item} (on|to) [the|my] {list}
          selector:
            text:
              multiple: true
              multiline: false
        error_response:
          name: Error response
          description: Used when the AI Task fails, or the items could not be added.
          default: Sorry, I couldn't add that to your list
          selector:
            text:
              multiline: true
              multiple: false
mode: parallel
max: 10
triggers:
- alias: Voice request to add an item
  trigger: conversation
  command: !input trigger
actions:
- alias: Set the input variables
  variables:
    version: 20261116
    ai_task_entity: !input ai_task_entity
    todo_entities: !input todo_entities
    default_list: !input default_list
- alias: Collect the todo lists
  variables:
    lists: "{% set ids = todo_entities if todo_entities else states.todo | map(attribute='entity_id')
      | list %} {% set ns = namespace(l=[]) %} {% for e in ids if states(e) not in
      ['unavailable', 'unknown'] %}\n  {% set sf = state_attr(e, 'supported_features')
      | int(0) %}\n  {% set due = 'due date and time' if sf | bitwise_and(32) else
      'due date only' if sf | bitwise_and(16) else 'no due dates' %}\n  {% set ns.l
      = ns.l + [{'value': e, 'label': entity_name(e, fallback=true), 'due': due}]
      %}\n{% endfor %} {{ ns.l }}\n"
    list_ids: '{{ lists | map(attribute=''value'') | list }}'
- alias: Create the structure and instructions for the AI Task
  variables:
    list_desc: '{% for o in lists %}{{ o.label }} = {{ o.value }} ({{ o.due }}){{
      ''; '' if not loop.last }}{% endfor %}'
    default_list_name: "{{ (lists | selectattr('value', 'eq', default_list) | map(attribute='label')
      | list | first) ~ ' (' ~ default_list ~ ')'\n   if default_list in list_ids
      else '' }}"
    llm_instructions: !input llm_instructions
    structure: "{% set s = {\n  'items': {'description': 'The items to add', 'required':
      true, 'selector': {'text': {'multiple': true}}},\n  'list': {'description':
      'The list to add the items to. Match on the name, return the id. Available (name
      = id): ' ~ list_desc,\n           'required': true, 'selector': {'select': {'options':
      lists | map(attribute='value') | list}}},\n  'due_date': {'description': 'Due
      date (YYYY-MM-DD), only when mentioned', 'selector': {'date': {}}},\n  'due_time':
      {'description': 'Due time (HH:MM:SS, 24 hour format), only when a time or part
      of the day is mentioned', 'selector': {'time': {}}},\n  'description': {'description':
      'Extra details for the item, only when given', 'selector': {'text': {}}}\n}
      %} {{ dict(s, confirmation={'description': 'Short confirmation in the language
      of the request', 'required': true, 'selector': {'text': {}}}) }}\n"
- alias: Stop when there are no todo lists
  if:
  - condition: template
    value_template: '{{ lists | count == 0 }}'
  then:
  - set_conversation_response: !input error_response
  - stop: No todo lists
- alias: Ask the AI Task to interpret the request
  action: ai_task.generate_data
  continue_on_error: true
  data: '{% set d = {''task_name'': ''Add todo item'', ''instructions'': llm_instructions,
    ''structure'': structure} %} {{ dict(d, entity_id=ai_task_entity) if ai_task_entity
    else d }}'
  response_variable: ai_result
- alias: Stop with error response when the AI Task failed
  if:
  - condition: template
    value_template: '{{ ai_result is not defined or ai_result.data is not defined
      or ai_result.data is string }}'
  then:
  - set_conversation_response: !input error_response
  - stop: AI Task failed
- alias: Read the result of the AI Task
  variables:
    llm: '{{ ai_result.data }}'
    items: '{% set i = llm.get(''items'') or [] %} {{ ([i] if i is string else i |
      list) | map(''string'') | map(''trim'') | reject(''eq'', '''') | list }}

      '
    list_entity: '{{ llm.get(''list'') if llm.get(''list'') in list_ids else default_list
      if default_list in list_ids else list_ids | first | default(none) }}

      '
    supports_date: '{{ state_attr(list_entity, ''supported_features'') | int(0) |
      bitwise_and(16) > 0 }}'
    supports_datetime: '{{ state_attr(list_entity, ''supported_features'') | int(0)
      | bitwise_and(32) > 0 }}'
    supports_description: '{{ state_attr(list_entity, ''supported_features'') | int(0)
      | bitwise_and(64) > 0 }}'
    due_time: '{% set t = llm.get(''due_time'') | default('''', true) | string | trim
      %} {% set t = t ~ '':00'' if t is match(''^\d{1,2}:\d{2}$'') else t %} {{ t
      if t and as_timedelta(t) is not none else '''' }}

      '
    due_date: "{% set d = llm.get('due_date') | default('', true) | string | trim
      %} {% if d is match('\\d{4}-\\d{2}-\\d{2}') %}\n  {{ d[:10] }}\n{% elif due_time
      %}\n  {{ (today_at() + timedelta(days=1 if today_at(due_time[:5]) <= now() else
      0)).date() | string }}\n{% else %}\n  {{ '' }}\n{% endif %}\n"
    description: '{{ llm.get(''description'') | default('''', true) | string | trim
      }}'
- alias: Create the data to add the items
  variables:
    due_datetime: '{{ (as_datetime(due_date) | as_local + as_timedelta(due_time)).isoformat()
      if due_date and due_time else '''' }}'
    add_data: "{% set d = {} %} {% if due_date and supports_datetime and due_time
      %}\n  {% set d = {'due_datetime': (as_datetime(due_date) | as_local + as_timedelta(due_time)).isoformat()}
      %}\n{% elif due_date and (supports_date or supports_datetime) %}\n  {% set d
      = {'due_date': due_date} %}\n{% endif %} {{ dict(d, description=description)
      if description and supports_description else d }}\n"
    due_not_set: '{{ due_date != '''' and not (supports_date or supports_datetime)
      }}'
- alias: Stop when there is nothing to add
  if:
  - condition: template
    value_template: '{{ items | count == 0 or list_entity is none }}'
  then:
  - set_conversation_response: !input error_response
  - stop: Nothing to add
- alias: Add the items
  repeat:
    for_each: '{{ items }}'
    sequence:
    - action: todo.add_item
      continue_on_error: true
      target:
        entity_id: '{{ list_entity }}'
      data: '{{ dict(add_data, item=repeat.item) }}'
- alias: Check if the items were added
  action: todo.get_items
  continue_on_error: true
  target:
    entity_id: '{{ list_entity }}'
  data:
    status: needs_action
  response_variable: check
- variables:
    on_list: '{{ check[list_entity][''items''] | map(attribute=''summary'') | list
      if check is defined else [] }}'
    added: '{{ items | select(''in'', on_list) | list }}'
- alias: Send back the response
  if:
  - condition: template
    value_template: '{{ added | count > 0 and (llm.get(''confirmation'') or '''')
      | trim | length > 0 }}'
  then:
  - set_conversation_response: '{{ llm.confirmation | trim }}'
  else:
  - set_conversation_response: !input error_response
