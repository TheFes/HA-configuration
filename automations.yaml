- id: '1794603369060'
  alias: Music Assistant - AI Task Enhanced Voice Support
  description: ''
  use_blueprint:
    input:
      ai_task_entity: ai_task.google_ai_task
      area_and_player_response: '{% if enqueue == ''add'' %}Ik voeg <media_info> toe
        aan de wachtrij in <area_info> en op <player_info>{% elif enqueue == ''next''
        %}Ik speel <media_info> hierna af in <area_info> en op <player_info>{% else
        %}Ik speel <media_info> {{ ''in willekeurige volgorde '' if shuffle }}af in
        <area_info> en op <player_info>{% endif %}'
      area_players:
      - media_player.woonkamer
      area_response: '{% if enqueue == ''add'' %}Ik voeg <media_info> toe aan de wachtrij
        in <area_info>{% elif enqueue == ''next'' %}Ik speel <media_info> hierna af
        in <area_info>{% else %}Ik speel <media_info> {{ ''in willekeurige volgorde
        '' if shuffle }}af in <area_info>{% endif %}'
      artist_text: van
      combine_text: en
      control_response: '{{ {''resume'': ''Ik speel verder'', ''next'': ''Volgende
        nummer'', ''previous'': ''Vorige nummer'', ''pause'': ''Gepauzeerd'', ''stop'':
        ''Gestopt''}.get(request_type, ''Oké'') }}'
      error_response: Sorry, er ging iets mis tijdens het verwerken van je muziek
        verzoek.
      no_target_response: Ik kon niet bepalen op welke speler ik dit moest afspelen,
        en er is geen standaard speler ingesteld.
      not_found_response: Sorry, ik kon <media_info> niet vinden.
      player_response: '{% if enqueue == ''add'' %}Ik voeg <media_info> toe aan de
        wachtrij op <player_info>{% elif enqueue == ''next'' %}Ik speel <media_info>
        hierna af op <player_info>{% else %}Ik speel <media_info> {{ ''in willekeurige
        volgorde '' if shuffle }}af op <player_info>{% endif %}'
      trigger:
