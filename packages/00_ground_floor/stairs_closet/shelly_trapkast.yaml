automation:
  - id: 1021cdb8-6a53-4e31-bc04-5d776323e1c8
    alias: "Actions for stairs closet sonoff"
    mode: parallel
    max_exceeded: silent
    triggers:
      - alias: "Sonoff stairs closet button pressed"
        trigger: state
        entity_id: event.trapkast_schakelaar_wand
        not_from: unavailable
    conditions:
      - alias: "Event entity still exists (not removed)"
        condition: template
        value_template: "{{ trigger.to_state is not none }}"
      - alias: "Check if button is in detached mode"
        condition: state
        entity_id: select.trapkast_schakelaar_wand_button_type
        state: Detached
    actions:
      - alias: "Check if light entity is available"
        if: "{{ 'light.trapkast' | has_value }}"
        then:
          - alias: "Choose action based on press type"
            choose:
              - conditions:
                  - alias: "Single press detected"
                    condition: template
                    value_template: "{{ trigger.to_state.attributes.event_type == 'single_push' }}"
                sequence:
                  - alias: "Toggle stairs closet light"
                    action: light.toggle
                    target:
                      entity_id: light.trapkast_template
              - conditions:
                  - alias: "Double press detected"
                    condition: template
                    value_template: "{{ trigger.to_state.attributes.event_type == 'double_push' }}"
                sequence:
                  - alias: "Toggle stairs closet light to full brightness"
                    action: light.toggle
                    target:
                      entity_id: light.trapkast_template
                    data:
                      brightness: 255
        else:
          - alias: "Toggle Sonoff relay as fallback"
            action: switch.toggle
            target:
              entity_id: switch.trapkast_schakelaar_wand
